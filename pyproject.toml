[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lite-assistant"
dynamic = ["version"]
description = "Local OpenAI-compatible voice and chat server: Gemma on LiteRT-LM, Kokoro speech, Moonshine transcription, MoGe-2 depth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    # uvicorn serves WebSockets (the Realtime API) only with this installed
    "websockets",
    "python-multipart",
    "platformdirs",
    "huggingface_hub",
    # Kokoro resamples with audioop, which Python 3.13 removed from the standard library
    "audioop-lts; python_version >= '3.13'",
    # Kokoro TTS
    "kokoro-onnx",
    "onnxruntime",
    # Reading audio files, and resampling them
    "soundfile",
    "soxr",
    # Gemma chat
    "litert-lm",
    # Realtime server VAD: Silero runs on onnxruntime, after resampling to 16 kHz
    "scipy",
    # MoGe-2 depth: a .tflite model, run by LiteRT's interpreter, on photos Pillow decodes
    "ai-edge-litert",
    "pillow",
    # GLiClass text classification: its tokenizer
    "tokenizers",
    # The web tools: DuckDuckGo search, and a page's main text
    "ddgs",
    "trafilatura",
    # search_notes reads PDFs
    "pypdf",
]

[project.urls]
Homepage = "https://github.com/PyDevices/lite-assistant"
Documentation = "https://github.com/PyDevices/lite-assistant/blob/main/docs/index.md"
Issues = "https://github.com/PyDevices/lite-assistant/issues"

[dependency-groups]
test = ["pytest", "httpx", "openai"]

[project.scripts]
lite-assistant = "lite_assistant.cli:main"

[tool.hatch.version]
path = "src/lite_assistant/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lite_assistant"]
